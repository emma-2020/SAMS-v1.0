name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values: config/env.js validates these are *present* at module
      # load time (before jest.mock() takes effect), but every backend unit
      # test fully mocks the Supabase client — no real network call is ever
      # made, so no real credentials are needed here.
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_KEY: ci-placeholder-service-key
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_JWT_SECRET: ci-placeholder-jwt-secret
      PORT: '4000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  web-typecheck:
    name: Web app typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sams/next test
