<?xml version="1.0" encoding="UTF-8"?>
<!--
  Android adaptive icon — foreground layer. Transparent background;
  content scaled to Android's ~66% safe zone. Pair with a solid
  background color (see ic_launcher_background.xml, #4F46E5).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="cutFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>

    <path id="shieldPath" d="M512,210 C462,210 415,192 390,160 C300,190 215,240 215,320 C215,590 340,780 512,880 C684,780 809,590 809,320 C809,240 724,190 634,160 C609,192 562,210 512,210 Z"/>
    <polygon id="starShape" points="512,50 529.64,95.73 578.57,98.37 540.53,129.27 553.16,176.63 512,150 470.84,176.63 483.47,129.27 445.43,98.37 494.36,95.73"/>
    <path id="leafL" d="M390,890 Q320,940 260,910 Q320,860 390,890 Z"/>
    <path id="leafR" d="M634,890 Q704,940 764,910 Q704,860 634,890 Z"/>
    <path id="leafL2" d="M430,850 Q360,895 300,870 Q360,830 430,850 Z"/>
    <path id="leafR2" d="M594,850 Q664,895 724,870 Q664,830 594,850 Z"/>

    <clipPath id="shieldClip"><use href="#shieldPath"/></clipPath>

    <mask id="sCut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <text x="512" y="648" font-size="500" font-weight="800" text-anchor="middle"
            font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
            fill="#000" letter-spacing="-8">S</text>
    </mask>
  </defs>

  <g transform="translate(512,512) scale(0.74) translate(-512,-495)">
    <use href="#starShape" fill="url(#shieldGrad)"/>
    <use href="#leafL2" fill="#4F46E5"/>
    <use href="#leafR2" fill="#4F46E5"/>
    <use href="#leafL" fill="#4F46E5"/>
    <use href="#leafR" fill="#4F46E5"/>
    <rect x="205" y="150" width="614" height="740" fill="url(#cutFill)" clip-path="url(#shieldClip)"/>
    <use href="#shieldPath" fill="url(#shieldGrad)" mask="url(#sCut)"/>
  </g>
</svg>
